org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# FLAG: Truffle Vault boars as the launcher icon (app/src/launcherIcons). Off: the boars stay inside the app.
boar.truffleLauncherIcons=false
# Boar Labs' image engine (sd-cli from scripts/build-sd-cli.sh, ~31 MB), in experimental builds. false: leaner, Image Gen says it's missing.
boar.labs.imageEngine=true
# Lab ids to hide from the Boar Labs grid, comma-separated (labs/LabPlugin.kt).
boar.labs.hide=
