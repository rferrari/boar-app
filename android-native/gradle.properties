org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# FLAG: Truffle Vault boars as the launcher icon (app/src/launcherIcons). Off: the boars stay inside the app.
boar.truffleLauncherIcons=false
# FLAG: Labs in the drawer (the image lab needs scripts/build-sd-cli.sh first). Off: no Labs, no sd-cli in the APK.
boar.labs=false
# Lab ids to hide from the Boar Labs grid, comma-separated (labs/LabPlugin.kt).
boar.labs.hide=
