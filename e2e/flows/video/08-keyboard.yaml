# On camera (POLISH #1 flow 8): keyboard up/down with an answer on screen, then in an empty New chat.
appId: ${APP_ID || "team.sopa.aoair.offline"}
---
- launchApp
# launchApp restarts the app: wait for the chat, or to-chat's Back lands on the splash and leaves the app
- extendedWaitUntil:
    visible: ${T_ASK}
    timeout: 60000
    optional: true
- runFlow: ../perf/to-chat.yaml
- tapOn: ${T_ASK}
- waitForAnimationToEnd:
    timeout: 3000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../prints/new-chat.yaml
- tapOn: ${T_ASK}
- waitForAnimationToEnd:
    timeout: 3000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
