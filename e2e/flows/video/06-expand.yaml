# On camera (POLISH #1 flow 6): in the sourced conversation, expand/collapse "Source 1: ..." and the receipt's
# "Performance details"; then in the places conversation, "Show N more".
appId: ${APP_ID || "team.sopa.aoair.offline"}
---
- launchApp
# launchApp restarts the app: wait for the chat, or to-chat's Back lands on the splash and leaves the app
- extendedWaitUntil:
    visible: ${T_ASK}
    timeout: 60000
    optional: true
- runFlow: ../perf/to-chat.yaml
- runFlow:
    when:
      notVisible:
        text: "${T_CONV_MONSOON}"
    commands:
      - tapOn: ${T_MENU}
      - tapOn:
          text: "${T_CONV_MONSOON}"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      text: "${T_SOURCE1}"
    optional: true
- tapOn:
    text: "${T_SOURCE1}"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "${T_SOURCE1}"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "${T_RECEIPT}"
    optional: true
- tapOn:
    text: "${T_RECEIPT}"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "${T_RECEIPT}"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ${T_MENU}
- tapOn:
    text: "${T_CONV_PLACES}"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "${T_SHOW_MORE}"
    direction: UP
    optional: true
- scrollUntilVisible:
    element:
      text: "${T_SHOW_MORE}"
    optional: true
- tapOn:
    text: "${T_SHOW_MORE}"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
