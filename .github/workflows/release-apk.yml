name: Release APK

# Builds the native Android app (android-native/) signed with BOAR's release key, checks it
# (scripts/check-release-apk.sh: package, versionCode, signer) and, when a tag is
# given, creates a draft GitHub Release with it. The version name is the tag without its v; the
# versionCode is the one in android-native/app/build.gradle.kts. Nobody's laptop needs the key.
#
# The key lives only in the "release" environment's secrets (docs/RELEASING.md),
# which can only be used from main, so a branch with an edited workflow can't
# read them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create as a draft (e.g. v2.0.0); also the version name. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes "tools", which sdkmanager no longer has.
          packages: platform-tools
      # The NDK and CMake the engine module pins, read from its build file so they can't drift.
      - name: Install NDK and CMake
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' android-native/engine/build.gradle.kts)
          cmake=$(sed -n 's/.*version = "\([0-9.]*\)".*/\1/p' android-native/engine/build.gradle.kts | head -1)
          echo "NDK $ndk, CMake $cmake"
          sdkmanager "ndk;$ndk" "cmake;$cmake"
      - uses: gradle/actions/setup-gradle@v4

      # The version comes from the tag (v2.0.0 -> 2.0.0); without a tag the build keeps build.gradle.kts's dev name.
      - name: Version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = tag ]; then TAG=$GITHUB_REF_NAME; fi
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
            echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "apk=boar-$TAG-arm64.apk" >> "$GITHUB_OUTPUT"
          else
            echo "apk=boar-dev-${GITHUB_SHA::8}-arm64.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the release key
        env:
          KEYSTORE_B64: ${{ secrets.BOAR_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.BOAR_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.BOAR_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BOAR_UPLOAD_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "the release environment is missing a signing secret ($v)"; exit 1; }
          done
          keystore="$RUNNER_TEMP/boar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          mkdir -p ~/.gradle
          {
            echo "BOAR_UPLOAD_STORE_FILE=$keystore"
            echo "BOAR_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "BOAR_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "BOAR_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      # No .env here, so the build has no Share results button (EVAL_SHARING off). The Labs switches are built in;
      # the labs' own executables (scripts/build-sd-cli.sh, scripts/build-lab-engines.sh) are not built here.
      - name: Build
        working-directory: android-native
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -Pboar.experimentalFeatures=true ${VERSION_NAME:+-Pboar.versionName=$VERSION_NAME}

      - name: Check package, versionCode and signer
        run: scripts/check-release-apk.sh android-native/app/build/outputs/apk/release/app-release.apk

      - name: Name it as the release does
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          mkdir -p out
          mv android-native/app/build/outputs/apk/release/app-release.apk "out/$APK"
          (cd out && sha256sum "$APK" > "$APK.sha256" && cat "$APK.sha256")

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/boar-release.jks" ~/.gradle/gradle.properties

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          if-no-files-found: error

  publish:
    name: Draft release
    needs: build
    if: inputs.tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          # An existing tag must be this commit: --target is ignored for a tag that's already there.
          # (git ls-remote prints nothing for a missing tag; gh api printed its error JSON instead.)
          refs=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          # An annotated tag lists its tag object and, as ^{}, the commit it points to.
          existing=$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$refs")
          [ -n "$existing" ] || existing=$(awk 'NR == 1 { print $1 }' <<<"$refs")
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "tag $TAG already points to $existing, not this build ($GITHUB_SHA)"; exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "BOAR $TAG" --notes "Draft: write the notes before publishing."
          for f in "boar-$TAG-arm64.apk" "boar-$TAG-arm64.apk.sha256"; do
            gh release upload "$TAG" "out/$f"
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
